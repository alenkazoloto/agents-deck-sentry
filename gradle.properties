# The Agents Deck distribution this extension builds and runs against.
#
# Produce it with `./gradlew buildPlugin` in the host repository root; it lands at
# `build/distributions/agents-deck-<version>.zip`. Relative values resolve against this
# directory (`extensions/sentry`), so the default points at a host repo two levels up.
#
# `./gradlew verifyExtensions` in the host overrides this with `-PagentsDeckPluginZip=` taking
# the zip from `buildPlugin`'s own output, precisely so this version-numbered default cannot
# silently keep verifying last release's artifact.
agentsDeckPluginZip=../../build/distributions/agents-deck-0.1.0.zip

# Kotlin stdlib is provided by the IntelliJ Platform — never bundle your own.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
